# cargo-deny configuration (deny.toml)
# Advisory ignores are in .cargo/audit.toml (cargo-audit config).

[advisories]
# cargo-deny advisory policy — kept in sync with .cargo/audit.toml (cargo-audit's own ignore
# list) EXCEPT where noted below; same waivers, same reasoning, both files must be updated
# together unless a divergence is explicitly documented.
#
# RUSTSEC-2023-0071 (rsa) and RUSTSEC-2026-0124 (libcrux-chacha20poly1305) are intentionally
# NOT listed here even though they're still ignored in .cargo/audit.toml. cargo-deny resolves
# the dependency graph with feature-unification (same as `cargo tree`), which confirms both
# crates are never actually compiled into any Powehi target (rsa: sqlx "mysql" feature is not
# activated; libcrux-chacha20poly1305: reached only via a non-activated PQ feature path in
# openmls_rust_crypto) — cargo-deny reports "no crate matched advisory criteria" for both, i.e.
# they cannot fire. cargo-audit scans Cargo.lock directly without feature resolution, so it still
# needs the explicit ignore. If cargo-deny ever starts reporting these again (e.g. a feature gets
# activated), re-add the ignore entries here and re-verify the "not compiled" claim.
#
# RUSTSEC-2026-0253 (lru 0.16.4, unsound use-after-free in LruCache::pop under panicking Drop) is
# also intentionally NOT listed here, for a different reason: `cargo deny check advisories
# --format json` reports zero advisories for it even though `lru` IS compiled in (`cargo tree -i
# lru` resolves via aws-sdk-s3 -> powehi-r2 -> powehi-server) — cargo-deny 0.20.2's default
# advisory policy only errors on `vulnerability`-category entries, not `informational = "unsound"`
# ones like this. cargo-audit has no such distinction, so it still needs the explicit ignore (see
# .cargo/audit.toml for the full unreachability rationale). If cargo-deny's default policy for
# unsound advisories ever changes (or `[advisories] unsound = "deny"` gets added below), mirror the
# .cargo/audit.toml entry here too.
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via tonic 0.12.3; no upgrade path until tonic 0.13 drops" },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitive via fluvio-wasm-timer -> openmls 0.8.1; no fix available, no upgrade path within current openmls release" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; compile-time-only proc-macro via hax-lib -> libcrux -> openmls_rust_crypto 0.5.1 (PQ support); not present in any built binary, no upgrade path until openmls_rust_crypto updates libcrux" },
    # RUSTSEC-2026-0207/-0208/-0212 (libcrux-sha3, libcrux-secrets): unlike RUSTSEC-2026-0124
    # above, these ARE resolved into powehi-crypto-wasm by cargo-deny's feature-aware graph
    # (hpke-rs 0.6.1's dependency on libcrux-sha3 is mandatory, not gated by hpke-rs's optional
    # "libcrux" feature) -- confirmed via `cargo deny check advisories`, which flags exactly these
    # three and none of the aesgcm/p256/ecdh advisories, matching `cargo tree -i` output. But the
    # only two call sites into libcrux_sha3 (hpke-rs-0.6.1/src/kem.rs:154,158) are inside the
    # X-Wing/ML-KEM post-quantum KEM branch of derive_key_pair(), which openmls_rust_crypto
    # 0.5.1's provider (kem_mode()) cannot even construct (unimplemented!() / no ML-KEM arm) --
    # structurally unreachable via Powehi's only supported ciphersuite (classical DHKEMX25519).
    # libcrux-secrets is reachable only via libcrux-sha3 (no independent entry point), so it
    # inherits the same argument. Bonus: even if reached, hpke-rs's calls are single one-shot
    # shake256::<32>/<64>() calls with lengths the advisories' own text says are unaffected
    # (0207 needs multiple incremental squeeze calls; 0208 needs length >32 and not div-by-8).
    # Verified via crypto-reviewer, cycle 305; full reasoning in .cargo/audit.toml. Re-verify (grep
    # libcrux_sha3 call sites + kem_mode() ML-KEM arm) on any hpke-rs/openmls_rust_crypto bump, and
    # re-open before shipping a PQ hybrid ciphersuite through this same provider.
    { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 shake256 compiled in but only called from openmls_rust_crypto-unreachable PQ KEM branches (X-Wing/ML-KEM); see .cargo/audit.toml for full trace" },
    { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 AVX2 shake256 compiled in but only called from openmls_rust_crypto-unreachable PQ KEM branches; hpke-rs's own call lengths (32/64) are also outside the buggy range; see .cargo/audit.toml" },
    { id = "RUSTSEC-2026-0212", reason = "libcrux-secrets reachable only via libcrux-sha3, which is only called from openmls_rust_crypto-unreachable PQ KEM branches; see .cargo/audit.toml for full trace" },
]

[licenses]
# Acceptable SPDX license expressions for direct and transitive dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
    # webpki-roots bundles Mozilla's CA certificate data under this license — it's a data
    # license for the bundled CA list, not a code license; standard to allow for rustls users.
    "CDLA-Permissive-2.0",
]

[licenses.private]
# All powehi-* workspace crates are unpublished (publish = false) and intentionally
# AGPL-3.0-only licensed (see Cargo.toml [workspace.package]) — that's our own project's
# license, not a dependency we're pulling in, so it must not be checked against the
# third-party allow list above.
ignore = true

[bans]
# Deny duplicate versions of security-critical crates to keep the dependency graph tight.
multiple-versions = "warn"
deny = []
