### Local dev environment (prd.md §12.1: local = docker-compose, no real data).
### Backs `bin/powehi-server` for manual local runs and the live-backend
### Playwright E2E harness (app/e2e/live-backend-*.spec.ts). Image tags are
### pinned to match the ones already exercised by the testcontainers
### integration suites (powehi-postgres/-redis/-r2 `*_it.rs`) so local/CI/dev
### behavior stays identical.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: powehi
      POSTGRES_PASSWORD: powehi
      POSTGRES_DB: powehi
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powehi"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2022-02-07T08-17-33Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: creates the `powehi-media` bucket that R2MediaAdapter expects.
  # Exits after bucket creation; not part of the long-running service set.
  minio-init:
    # minio/mc does not publish tags matching the minio/minio server's dated
    # RELEASE.* scheme (confirmed by a failed CI pull, cycle 277) — mc has its
    # own independent tag history, so `latest` is used here instead.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/powehi-media
      "
