name: Deployed smoke test
description: Wait for /health, then two CLI profiles register, invite and exchange messages (live_e2e.rs).
inputs:
  api-url:
    description: https URL of the deployed API, no trailing slash.
    required: true
runs:
  using: composite
  steps:
    - name: Wait for /health
      shell: bash
      env:
        API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        for i in $(seq 1 30); do
          if curl -fsS --max-time 10 "${API_URL}/health" > /dev/null; then exit 0; fi
          sleep 10
        done
        echo "${API_URL} did not become healthy within 5 minutes" >&2
        exit 1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
    - name: Register, invite and exchange messages both ways
      shell: bash
      env:
        POWEHI_E2E_SERVER: ${{ inputs.api-url }}
      run: cargo test -p powehi-cli --lib deployed_smoke -- --ignored --nocapture
