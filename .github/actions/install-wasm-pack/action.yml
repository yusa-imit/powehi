name: Install wasm-pack
description: >-
  Download a pinned wasm-pack release tarball for x86_64 Linux, verify its
  SHA-256 checksum, and put the binary on PATH. Replaces the previous
  unpinned `curl | sh` installer script (no version pin, no checksum,
  arbitrary shell execution from a network fetch).
runs:
  using: composite
  steps:
    - name: Download, verify, and install wasm-pack
      shell: bash
      env:
        # x86_64-unknown-linux-musl matches ubuntu-latest's architecture on
        # all call sites today; bumping the version below requires updating
        # WASM_PACK_SHA256 to match (previously the unpinned installer
        # silently tracked "latest" — this is the tradeoff of pinning).
        WASM_PACK_VERSION: 0.13.1
        WASM_PACK_SHA256: c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539
      run: |
        set -euo pipefail
        asset="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl"
        url="https://github.com/wasm-bindgen/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${asset}.tar.gz"
        tmpdir="$(mktemp -d)"
        curl -fsSL -o "${tmpdir}/wasm-pack.tar.gz" "${url}"
        echo "${WASM_PACK_SHA256}  ${tmpdir}/wasm-pack.tar.gz" | sha256sum -c -
        tar -xzf "${tmpdir}/wasm-pack.tar.gz" -C "${tmpdir}"
        install -m 0755 "${tmpdir}/${asset}/wasm-pack" /usr/local/bin/wasm-pack
        rm -rf "${tmpdir}"
        wasm-pack --version
