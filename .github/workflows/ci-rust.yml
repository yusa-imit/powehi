name: CI — Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: cargo nextest run
        run: cargo nextest run --workspace

  integration-test:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: Pre-pull Postgres image
        # Pre-pull avoids transient "bytes remaining on stream" errors during
        # the testcontainers layer download inside the test process.
        run: docker pull postgres:16-alpine

      - name: cargo nextest run (testcontainers integration)
        # Runs only the pg_security_it binary (testcontainers-based) which starts
        # its own ephemeral Postgres — does NOT run push_subscription_repo_it
        # which requires a pre-existing TEST_DATABASE_URL.
        run: cargo nextest run -p powehi-postgres --run-ignored all -E 'binary(pg_security_it)'

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # Ignored advisories are listed with full impact analysis in .cargo/audit.toml.
        run: cargo audit
