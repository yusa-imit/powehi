name: CI — Rust

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2

      - name: cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2

      # Deliberately NOT SHA-pinned: taiki-e/install-action's own docs say
      # pinning @<tool_name> tags by hash is "strongly discouraged" because
      # the tag is repointed on every release, so a hash pin would end up
      # referencing an "impostor commit" not reachable from the repo once
      # the tag moves on — the tool-name ref is the maintainer-recommended
      # update mechanism for tracking the latest nextest-compatible release.
      - uses: taiki-e/install-action@nextest

      - name: cargo nextest run
        run: cargo nextest run --workspace

  integration-test:
    name: Integration Tests (Docker)
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2

      # Deliberately NOT SHA-pinned: taiki-e/install-action's own docs say
      # pinning @<tool_name> tags by hash is "strongly discouraged" because
      # the tag is repointed on every release, so a hash pin would end up
      # referencing an "impostor commit" not reachable from the repo once
      # the tag moves on — the tool-name ref is the maintainer-recommended
      # update mechanism for tracking the latest nextest-compatible release.
      - uses: taiki-e/install-action@nextest

      - name: Pre-pull Postgres image
        # Pre-pull avoids transient "bytes remaining on stream" errors during
        # the testcontainers layer download inside the test process.
        run: docker pull postgres:16-alpine

      - name: cargo nextest run (testcontainers integration)
        # Runs only the pg_security_it binary (testcontainers-based) which starts
        # its own ephemeral Postgres — does NOT run push_subscription_repo_it
        # which requires a pre-existing TEST_DATABASE_URL.
        run: cargo nextest run -p powehi-postgres --run-ignored all -E 'binary(pg_security_it)'

      - name: Pre-pull Redis image
        # Pre-pull avoids transient "bytes remaining on stream" errors during
        # the testcontainers layer download inside the test process.
        run: docker pull redis:7-alpine

      - name: cargo nextest run (redis testcontainers integration)
        # Runs the redis_cache_it, redis_event_bus_it and redis_abuse_signal_it
        # binaries (all testcontainers-based), each starting its own ephemeral
        # Redis and exercising RedisCache / RedisEventBus / AbuseSignalStore
        # against real Redis.
        run: cargo nextest run -p powehi-redis --run-ignored all -E 'binary(redis_cache_it) or binary(redis_event_bus_it) or binary(redis_abuse_signal_it)'

      - name: Pre-pull MinIO image
        # Pre-pull avoids transient "bytes remaining on stream" errors during
        # the testcontainers layer download inside the test process. Tag must
        # match MINIO_TAG in r2_media_it.rs, or this step warms an image the
        # test never actually uses.
        run: docker pull minio/minio:RELEASE.2025-02-28T09-55-16Z

      - name: cargo nextest run (r2 testcontainers integration)
        # Runs only the r2_media_it binary (testcontainers-based) which starts
        # its own ephemeral Postgres + MinIO and exercises R2MediaAdapter against
        # real Postgres metadata rows + real S3-compatible presigned URLs.
        run: cargo nextest run -p powehi-r2 --run-ignored all -E 'binary(r2_media_it)'

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # Ignored advisories are listed with full impact analysis in .cargo/audit.toml.
        run: cargo audit

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: cargo deny check
        # Waivers + rationale live in deny.toml, kept in sync with .cargo/audit.toml.
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902  # v2

  tauri-check:
    name: Tauri shell (check, locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      # app/src-tauri is a standalone [workspace], deliberately not a member
      # of the root Cargo.toml (see the comment in its Cargo.toml) — it needs
      # system WebKit/appindicator deps that the server crates don't. This
      # job only proves the lockfile matches the manifest and the crate
      # type-checks; it does not build/bundle the desktop binary.
      - name: Install Tauri Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: app/src-tauri

      - name: cargo check --locked
        run: cargo check --locked --manifest-path app/src-tauri/Cargo.toml --all-targets

      # --locked alone only catches a manifest requirement missing from the
      # lockfile (issue #7's exact bug). It does NOT catch a re-resolve that
      # picks a different but still-valid graph (e.g. the local JetBrains Rust
      # indexer regenerating the file against the same manifest) — that kind
      # of rewrite is self-consistent, so --locked has nothing to reject. This
      # diff catches that class too by regenerating and comparing byte-for-byte.
      - name: Verify Cargo.lock has no unresolved drift
        working-directory: app/src-tauri
        run: |
          cp Cargo.lock /tmp/tauri-cargo-lock-committed
          cargo generate-lockfile
          diff -u /tmp/tauri-cargo-lock-committed Cargo.lock
