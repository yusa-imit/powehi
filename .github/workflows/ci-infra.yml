name: CI — Infra

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'infra/helm/**'
      - 'infra/terraform/**'
      - 'infra/policy/**'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/helm/**'
      - 'infra/terraform/**'
      - 'infra/policy/**'
      - '.github/workflows/ci-infra.yml'

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-validate:
    name: Helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5.0.1
        with:
          version: "v4.2.4"

      - name: Install kubeconform (SHA-verified)
        env:
          KUBECONFORM_VERSION: "v0.8.0"
        run: |
          set -euo pipefail
          curl -sSfL -o kubeconform-linux-amd64.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          curl -sSfL -o CHECKSUMS \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz\$" CHECKSUMS > kubeconform.sha256
          sha256sum --check kubeconform.sha256
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install conftest (SHA-verified)
        env:
          CONFTEST_VERSION: "0.69.0"
        run: |
          set -euo pipefail
          curl -sSfL -o conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          curl -sSfL -o checksums.txt \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/checksums.txt"
          grep " conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz\$" checksums.txt > conftest.sha256
          sha256sum --check conftest.sha256
          tar -xzf conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz conftest
          chmod +x conftest
          sudo mv conftest /usr/local/bin/conftest

      - name: helm lint — base chart
        working-directory: infra/helm/powehi
        run: helm lint .

      - name: helm lint + kubeconform — overlays (prod-eu, prod-ap, staging)
        working-directory: infra/helm/powehi
        # No -kubernetes-version pin: every env's k3s_version is left empty
        # ("latest") in infra/terraform, so there is no real pinned target
        # version to assert here — validate against kubeconform's default
        # (master) schema set instead of fabricating a version.
        run: |
          set -euo pipefail
          for overlay in values-prod-eu.yaml values-prod-ap.yaml values-staging.yaml; do
            echo "::group::helm lint -f ${overlay}"
            helm lint . -f "${overlay}"
            echo "::endgroup::"

            echo "::group::helm template -f ${overlay} | kubeconform"
            # -schema-location default covers core/built-in kinds; the second
            # -schema-location adds the community CRD catalog so ExternalSecret
            # (external-secrets.io) and ServiceMonitor (monitoring.coreos.com)
            # — both rendered by this chart — have schemas to validate against
            # instead of erroring as "could not find schema for <kind>".
            helm template . -f "${overlay}" \
              | kubeconform -strict -summary -output json \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"

            echo "::group::helm template -f ${overlay} | conftest test"
            # --combine: network_policy.rego reasons over all rendered
            # documents from this overlay together (e.g. Deployment +
            # NetworkPolicy cross-references), not each doc in isolation.
            helm template . -f "${overlay}" \
              | conftest test - -p ../../policy --combine
            echo "::endgroup::"
          done

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          # Kept in sync with infra/terraform/.terraform-version and the
          # `required_version = ">= 1.6"` constraint declared in every env's
          # versions.tf (dev, prod-eu, prod-ap-seoul) and the hetzner-k3s module.
          terraform_version: "1.6.2"
          terraform_wrapper: false

      - name: terraform fmt (check)
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform init + validate — dev
        working-directory: infra/terraform/envs/dev
        # -backend=false: syntax/schema validation only, no cloud credentials
        # or remote state access available (or wanted) in this CI job.
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform init + validate — prod-eu
        working-directory: infra/terraform/envs/prod-eu
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform init + validate — prod-ap-seoul
        working-directory: infra/terraform/envs/prod-ap-seoul
        run: |
          terraform init -backend=false
          terraform validate
