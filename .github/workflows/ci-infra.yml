name: CI — Infra

# Home of the OpenTofu checks (Phase 9.2 adds fmt/validate/tflint/trivy/tofu test).
# Until infra/terraform exists this workflow only lints itself.

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci-infra.yml'

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tofu-layout:
    name: OpenTofu layout present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: No Kubernetes or Hetzner leftovers
        run: |
          set -euo pipefail
          if [ -e infra/helm ] || [ -e infra/argocd ] || [ -e infra/policy ]; then
            echo "Kubernetes-era infra directories were discarded in ADR-0007" >&2
            exit 1
          fi
