name: Release — SLSA L3 Provenance + Container Sign

# Triggered by a semver tag push (e.g. v0.1.0).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}  # all jobs declare minimum required permissions explicitly

# Prevent concurrent releases from the same ref (never cancel mid-release).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Build the release binary ──────────────────────────────────────────────
  build-binary:
    name: Build release binary
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
    steps:
      # SHA-pinned actions prevent tag-mutable supply-chain tampering.
      # Semver comments document the human-readable version the SHA resolves to.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # dtolnay/rust-toolchain SHA-pinned to master@2026-06.
      # Toolchain version 1.87.0 matches Dockerfile, rust-toolchain.toml and
      # Cargo.toml rust-version (MSRV).
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.96.0"

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2

      - name: Build (SOURCE_DATE_EPOCH=0 for reproducibility)
        env:
          SOURCE_DATE_EPOCH: "0"
        # --locked: ensures Cargo resolves deps from the committed Cargo.lock
        # only, preventing silent dep-tree drift in release artifacts.
        run: cargo build --release --locked --bin powehi-server

      - name: Rename artifact
        run: cp target/release/powehi-server powehi-server-linux-amd64

      - name: Compute SHA-256 subjects
        id: hash
        run: |
          echo "hashes=$(sha256sum powehi-server-linux-amd64 | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: powehi-server-linux-amd64
          path: powehi-server-linux-amd64
          if-no-files-found: error

  # ── 2. SLSA L3 provenance for the binary ─────────────────────────────────────
  # The generator_generic_slsa3 reusable workflow runs the build in an isolated
  # ephemeral environment, signs the provenance with a short-lived OIDC cert
  # (Sigstore keyless), and uploads the .intoto.jsonl attestation to Rekor.
  # NOTE: slsa-github-generator reusable workflows MUST be pinned by semver tag
  # (upstream explicitly forbids SHA-pinning for reusable workflows).
  binary-provenance:
    name: Binary SLSA L3 provenance
    needs: build-binary
    permissions:
      actions: read
      id-token: write   # for OIDC keyless signing
      contents: write   # to attach provenance to the GitHub release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build-binary.outputs.hashes }}"
      upload-assets: true

  # ── 3. Build + push container image ─────────────────────────────────────────
  build-push-container:
    name: Build and push container image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write   # required for cosign keyless OIDC signing (step below)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/powehi-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            SOURCE_DATE_EPOCH=0
          # provenance=false: SLSA attestation is attached by container-provenance job below.
          # cache-from/to disabled for release builds: GHA cache is writeable by all
          # repo workflows; a poisoned layer could silently alter the signed image.
          provenance: false
          sbom: false

      # Sign the container image with cosign keyless (Sigstore OIDC).
      # id-token: write (declared above) gives cosign the OIDC token it needs.
      # The signature and certificate are automatically recorded in Rekor.
      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3

      - name: Sign image with cosign (keyless → Rekor)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/powehi-server
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  # ── 4. SLSA L3 container provenance ─────────────────────────────────────────
  # Attaches a signed SLSA provenance attestation to the OCI image and records
  # it in Rekor.  This is separate from (and in addition to) the cosign sign
  # step above, which covers the raw image-signature requirement.
  # GITHUB_TOKEN is passed so the generator can push the attestation to GHCR;
  # its scope is bounded to the packages: write permission declared in this job.
  container-provenance:
    name: Container SLSA L3 provenance
    needs: build-push-container
    permissions:
      actions: read
      id-token: write   # for OIDC keyless signing
      packages: write   # to push attestation to GHCR
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ github.repository_owner }}/powehi-server
      digest: ${{ needs.build-push-container.outputs.digest }}
    secrets:
      registry-username: ${{ github.repository_owner }}
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Build the WASM crypto module ──────────────────────────────────────────
  # The WASM module is the most security-critical release artifact — it contains
  # all MLS/OPAQUE/ML-KEM crypto logic.  Provenance ties every shipped .wasm and
  # JS glue file back to an audited, reproducible source tree.
  # Both *_bg.wasm AND *.js are included as SLSA subjects: the JS glue controls
  # WASM memory layout and exports, so tampering with it subverts the .wasm too.
  build-wasm:
    name: Build WASM crypto module
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2

      # Install wasm-pack with --locked so Cargo.lock governs the wasm-bindgen-cli
      # version (a transitive dep that generates the JS glue).  Pinning the exact
      # version + --locked ensures the glue is byte-stable across CI runs.
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build WASM (SOURCE_DATE_EPOCH=0 for reproducibility)
        env:
          SOURCE_DATE_EPOCH: "0"
        run: wasm-pack build crates/client/powehi-crypto-wasm --target web --release

      # Hash both the .wasm binary AND the JS glue: the glue controls WASM exports
      # and memory layout, so an attacker who tampers with only the JS can subvert
      # the crypto module without touching the .wasm hash.
      - name: Compute SHA-256 subjects (wasm + JS glue)
        id: hash
        run: |
          PKG=crates/client/powehi-crypto-wasm/pkg
          HASHES=$(sha256sum \
            "$PKG/powehi_crypto_wasm_bg.wasm" \
            "$PKG/powehi_crypto_wasm.js" \
            | base64 -w0)
          echo "hashes=$HASHES" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: powehi-crypto-wasm
          path: |
            crates/client/powehi-crypto-wasm/pkg/powehi_crypto_wasm_bg.wasm
            crates/client/powehi-crypto-wasm/pkg/powehi_crypto_wasm.js
            crates/client/powehi-crypto-wasm/pkg/powehi_crypto_wasm.d.ts
          if-no-files-found: error

  # ── 6. SLSA L3 provenance for the WASM module ────────────────────────────────
  wasm-provenance:
    name: WASM SLSA L3 provenance
    needs: build-wasm
    permissions:
      actions: read
      id-token: write   # for OIDC keyless signing
      contents: write   # to attach .intoto.jsonl to the GitHub release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build-wasm.outputs.hashes }}"
      upload-assets: true
