replicaCount: 1

image:
  pullPolicy: Always

resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"

autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

region: eu-frankfurt
tier: "Tier1"

config:
  logLevel: "info"
  grpcTlsEnabled: true
  # r2Endpoint/r2Bucket/vapidContact are intentionally unset here — this env
  # needs real Cloudflare R2 account values and a real VAPID contact URI
  # before it can serve real media or Web Push traffic. Do not fake these.
  # r2Bucket in particular MUST be a distinct real bucket from every other
  # environment's — this overlay shares `region: eu-frankfurt` with
  # values-prod-eu.yaml, and the media orphan-sweep job's region-prefix
  # isolation (crates/adapters/outbound/powehi-r2, R2MediaAdapter::region_prefix)
  # only separates distinct regions sharing one bucket, not two environments
  # in the same region — sharing a bucket here would let this environment's
  # sweep delete prod-eu's live media (threat-model-checker RED finding,
  # cycle 424). AppConfig::validate() fails the pod at startup if r2Bucket is
  # left at the compiled dev default outside region_id=local, but that only
  # catches "forgot to set it", not "set both environments to the same real
  # bucket by mistake".

monitoring:
  serviceMonitor:
    enabled: true
    interval: "15s"
    additionalLabels:
      release: kube-prometheus-stack
  # Enabled alongside serviceMonitor (cycle 443) — this is a real
  # kube-prometheus-stack install, so the media-orphan-sweep alert rule
  # (templates/prometheusrule.yaml, cycle 442) needs the same
  # additionalLabels.release the operator's ruleSelector expects, or the
  # rule renders but Prometheus never picks it up. Staging uses the same
  # "1h" window as prod — the underlying sweep still runs every 6 hours
  # here too, so a shorter window would only reduce lookback margin
  # without adding real signal.
  prometheusRule:
    enabled: true
    window: "1h"
    additionalLabels:
      release: kube-prometheus-stack

otlp:
  endpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"
  serviceName: "powehi-staging"

externalSecrets:
  refreshInterval: "5m"
  secretStoreRef:
    name: "powehi-secret-store"
    kind: "ClusterSecretStore"
  remoteRefs:
    databaseUrl: "powehi/staging/database-url"
    redisUrl: "powehi/staging/redis-url"
    r2AccessKeyId: "powehi/staging/r2-access-key-id"
    r2SecretAccessKey: "powehi/staging/r2-secret-access-key"
    vapidPrivateKey: "powehi/staging/vapid-private-key"
    grpcTlsCert: "powehi/staging/grpc-tls-cert"
    grpcTlsKey: "powehi/staging/grpc-tls-key"
    grpcTlsCa: "powehi/staging/grpc-tls-ca"
