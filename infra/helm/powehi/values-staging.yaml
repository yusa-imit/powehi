replicaCount: 1

image:
  pullPolicy: Always

resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "50m"
    memory: "64Mi"

autoscaling:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

region: eu-frankfurt
tier: "Tier1"

config:
  logLevel: "info"
  grpcTlsEnabled: true

monitoring:
  serviceMonitor:
    enabled: true
    interval: "15s"
    additionalLabels:
      release: kube-prometheus-stack

otlp:
  endpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"
  serviceName: "powehi-staging"

externalSecrets:
  refreshInterval: "5m"
  secretStoreRef:
    name: "powehi-secret-store"
    kind: "ClusterSecretStore"
  remoteRefs:
    databaseUrl: "powehi/staging/database-url"
    redisUrl: "powehi/staging/redis-url"
    r2AccessKeyId: "powehi/staging/r2-access-key-id"
    r2SecretAccessKey: "powehi/staging/r2-secret-access-key"
    vapidPrivateKey: "powehi/staging/vapid-private-key"
    grpcTlsCert: "powehi/staging/grpc-tls-cert"
    grpcTlsKey: "powehi/staging/grpc-tls-key"
    grpcTlsCa: "powehi/staging/grpc-tls-ca"
