{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "powehi.fullname" . }}-external-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "powehi.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: powehi-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # secretKey names must be POWEHI__<FIELD> to match powehi-config's
    # config::Environment::with_prefix("POWEHI").separator("__") (see
    # crates/infra/powehi-config/src/lib.rs) — envFrom injects these keys as
    # env vars verbatim, so an unprefixed name is silently invisible to AppConfig.
    - secretKey: POWEHI__DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.databaseUrl }}
    - secretKey: POWEHI__REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.redisUrl }}
    - secretKey: POWEHI__R2_ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.r2AccessKeyId }}
    - secretKey: POWEHI__R2_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.r2SecretAccessKey }}
    - secretKey: POWEHI__VAPID_PRIVATE_KEY_PEM
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.vapidPrivateKey }}
    # GRPC_TLS_CERT/KEY/CA are deliberately NOT renamed here: AppConfig's
    # grpc_tls_cert/key/ca fields are consumed as filesystem paths
    # (bin/powehi-server/src/main.rs: TlsConfig::from_pem_files), not PEM
    # content, so env-var injection of raw cert bytes can never work for
    # these three regardless of naming — needs a Secret volumeMount +
    # POWEHI__GRPC_TLS_* set to the mount path instead. Tracked as a
    # follow-up, not fixed in this change.
    - secretKey: GRPC_TLS_CERT
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.grpcTlsCert }}
    - secretKey: GRPC_TLS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.grpcTlsKey }}
    - secretKey: GRPC_TLS_CA
      remoteRef:
        key: {{ .Values.externalSecrets.remoteRefs.grpcTlsCa }}
{{- end }}
