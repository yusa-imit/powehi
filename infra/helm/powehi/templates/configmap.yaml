apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "powehi.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "powehi.labels" . | nindent 4 }}
data:
  POWEHI__REGION: {{ required "values.region is required (eu-frankfurt|ap-seoul)" .Values.region | quote }}
  POWEHI__TIER: {{ .Values.tier | default "Tier1" | quote }}
  POWEHI__LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  POWEHI__ADMIN_PORT: {{ .Values.config.adminPort | quote }}
  POWEHI__GRPC_PORT: {{ .Values.config.grpcPort | quote }}
  POWEHI__GRPC_PEERS: {{ .Values.config.grpcPeers | quote }}
  POWEHI__GRPC_TLS_ENABLED: {{ .Values.config.grpcTlsEnabled | quote }}
  {{- if .Values.otlp.endpoint }}
  # OTLP/gRPC collector endpoint for distributed trace export (prd.md §13.3).
  # Absent when otlp.endpoint is empty — app falls back to Prometheus-only mode.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otlp.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otlp.serviceName | default "powehi" | quote }}
  {{- end }}
