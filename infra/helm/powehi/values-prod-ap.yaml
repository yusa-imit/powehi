replicaCount: 2

image:
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: "2"
    memory: "1Gi"
  requests:
    cpu: "200m"
    memory: "256Mi"

autoscaling:
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

region: ap-seoul
tier: "Tier1"

config:
  logLevel: "info"
  grpcTlsEnabled: true
  grpcPeers: ""
  # r2Endpoint/r2Bucket/vapidContact are intentionally unset here — this env
  # needs real Cloudflare R2 account values and a real VAPID contact URI
  # before it can serve real media or Web Push traffic. Do not fake these.
  # r2Bucket in particular MUST be a distinct real bucket from every other
  # environment's — the media orphan-sweep job's region-prefix isolation
  # (crates/adapters/outbound/powehi-r2, R2MediaAdapter::region_prefix) only
  # separates distinct regions sharing one bucket, not two environments that
  # accidentally share a bucket (threat-model-checker RED finding, cycle
  # 424). AppConfig::validate() fails the pod at startup if r2Bucket is left
  # at the compiled dev default outside region_id=local, but that only
  # catches "forgot to set it", not "set two environments to the same real
  # bucket by mistake".

monitoring:
  serviceMonitor:
    enabled: true
    interval: "30s"
    additionalLabels:
      release: kube-prometheus-stack
  # Enabled alongside serviceMonitor (cycle 443) — this is a real
  # kube-prometheus-stack install, so the media-orphan-sweep alert rule
  # (templates/prometheusrule.yaml, cycle 442) needs the same
  # additionalLabels.release the operator's ruleSelector expects, or the
  # rule renders but Prometheus never picks it up.
  prometheusRule:
    enabled: true
    window: "1h"
    additionalLabels:
      release: kube-prometheus-stack

otlp:
  endpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"
  serviceName: "powehi-ap"

externalSecrets:
  refreshInterval: "1h"
  secretStoreRef:
    name: "powehi-secret-store"
    kind: "ClusterSecretStore"
  remoteRefs:
    databaseUrl: "powehi/prod-ap/database-url"
    redisUrl: "powehi/prod-ap/redis-url"
    r2AccessKeyId: "powehi/prod-ap/r2-access-key-id"
    r2SecretAccessKey: "powehi/prod-ap/r2-secret-access-key"
    vapidPrivateKey: "powehi/prod-ap/vapid-private-key"
    grpcTlsCert: "powehi/prod-ap/grpc-tls-cert"
    grpcTlsKey: "powehi/prod-ap/grpc-tls-key"
    grpcTlsCa: "powehi/prod-ap/grpc-tls-ca"
