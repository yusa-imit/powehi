replicaCount: 2

image:
  repository: ghcr.io/yusa-imit/powehi
  pullPolicy: IfNotPresent
  tag: ""  # overridden per deploy; empty falls back to .Chart.AppVersion

service:
  type: ClusterIP
  publicPort: 8080
  adminPort: 9090
  grpcPort: 50051

resources:
  limits:
    cpu: "1"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true

# REQUIRED: eu-frankfurt | ap-seoul
region: ""

# Region tier for capacity routing and API response headers (prd.md §4A).
# Tier1 = full R/W primary; Tier2 = read-replica + relay write forwarding.
tier: "Tier1"

config:
  logLevel: "info"
  adminPort: "9090"
  grpcPort: "50051"
  grpcPeers: ""         # CSV: https://peer1:50051,https://peer2:50051
  # Gates whether the grpc-tls Secret is mounted (deployment.yaml) and whether
  # POWEHI__GRPC_TLS_CERT/KEY/CA point at the mounted paths (configmap.yaml).
  # Default false preserves current effective behavior (TLS has never actually
  # been wired anywhere). Must be true before config.grpcPeers is populated for
  # real cross-region mesh traffic — main.rs's fail-closed check refuses to
  # start if grpcPeers is set but grpc_tls_enabled() is false.
  grpcTlsEnabled: false
  # Postgres pool size. Matches Rust compiled default (POWEHI__DATABASE_MAX_CONNECTIONS).
  databaseMaxConnections: 20
  # Per-call R2 S3 operation timeout, seconds. Matches Rust compiled default (POWEHI__R2_REQUEST_TIMEOUT_SECS).
  r2RequestTimeoutSecs: 30
  # Whole hourly media-blob GC sweep timeout, seconds. Matches Rust compiled default (POWEHI__MEDIA_GC_SWEEP_TIMEOUT_SECS).
  mediaGcSweepTimeoutSecs: 1800

# Prometheus Operator ServiceMonitor for scraping /metrics on the admin port.
# Set monitoring.serviceMonitor.enabled=true when kube-prometheus-stack is installed.
monitoring:
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    # Additional labels to attach to the ServiceMonitor (e.g. for Prometheus selector).
    additionalLabels: {}

# OpenTelemetry OTLP trace export (prd.md §13.3).
# Set otlp.endpoint to the OTLP/gRPC collector address to enable trace export.
# Leave blank to disable OTLP (Prometheus pull-only mode).
otlp:
  endpoint: ""          # e.g. "http://otel-collector.monitoring:4317"
  serviceName: "powehi"

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: "powehi-secret-store"
    kind: "ClusterSecretStore"
  remoteRefs:
    databaseUrl: "powehi/database-url"
    redisUrl: "powehi/redis-url"
    r2AccessKeyId: "powehi/r2-access-key-id"
    r2SecretAccessKey: "powehi/r2-secret-access-key"
    vapidPrivateKey: "powehi/vapid-private-key"
    grpcTlsCert: "powehi/grpc-tls-cert"
    grpcTlsKey: "powehi/grpc-tls-key"
    grpcTlsCa: "powehi/grpc-tls-ca"
