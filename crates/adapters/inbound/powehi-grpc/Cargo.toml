[package]
name = "powehi-grpc"
description = "gRPC inter-region adapter for the Powehi cross-region mesh."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
powehi-domain = { workspace = true }
powehi-port-outbound = { workspace = true }
powehi-proto = { workspace = true }
tonic = { workspace = true, features = ["tls"] }
prost = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
futures-core = "0.3"
http = "1"
# X.509 peer-cert parsing for mTLS region binding (RED-2/RED-3)
x509-parser = { workspace = true }
# Per-origin-region rate limiting for PropagateAbuseSignal (security-auditor
# finding, cycle 433) — same crate/version already vetted via powehi-rest-api.
governor = { workspace = true }

rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio-rustls = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# rcgen: cert generation for TLS unit tests only — not in production binary
rcgen = "0.13"
