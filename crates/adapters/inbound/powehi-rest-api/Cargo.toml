[package]
name = "powehi-rest-api"
description = "Axum REST API inbound adapter."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
powehi-domain = { workspace = true }
powehi-port-inbound = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
# SECURITY: do NOT add the "tracing" feature — it logs raw client IPs via
# key_name() which violates the no-plaintext-logging rule.
tower_governor = { version = "0.4", features = ["axum"] }
governor = "0.6"
http = "1"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
# `oneshot` lives behind tower's `util` feature; enable it for the router tests.
tower = { workspace = true, features = ["util"] }
