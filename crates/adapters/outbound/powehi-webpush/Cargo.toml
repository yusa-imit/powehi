[package]
name = "powehi-webpush"
description = "Web Push (RFC 8291 + RFC 8292 VAPID) outbound adapter."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
powehi-domain = { workspace = true }
powehi-port-outbound = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
p256 = { workspace = true }
reqwest = { workspace = true }
base64ct = { workspace = true }

[dev-dependencies]
# `SigningKey::random` needs an RNG; pull the same rand_core p256 0.13 uses (0.6).
rand_core = { version = "0.6", features = ["getrandom"] }
