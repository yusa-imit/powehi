[package]
name = "powehi-r2"
description = "Cloudflare R2 / S3-compatible media storage adapter (presigned URL pattern)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
powehi-domain = { workspace = true }
powehi-port-outbound = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
thiserror = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-credential-types = { workspace = true }
reqwest = { workspace = true }
powehi-domain = { workspace = true }
powehi-port-outbound = { workspace = true }
powehi-postgres = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
# Test-only HTTP replay client for unit-testing verify_region_ownership's S3
# claim/self-verify/race-loss branches without Docker/MinIO (mismatch/vanished
# branches the real testcontainers claim-race test in tests/r2_media_it.rs
# can't deterministically hit). Not a new production runtime dependency.
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-types = "1"
http = "1"
