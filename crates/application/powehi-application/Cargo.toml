[package]
name = "powehi-application"
description = "Use-case implementations. Depends only on domain + port traits."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
powehi-domain = { workspace = true }
powehi-port-inbound = { workspace = true }
powehi-port-outbound = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
# Ed25519 verification for §8.5 recovery-phrase login proof (verify-only path).
# Wires the already-approved, pinned workspace dep into this crate (no new library).
ed25519-dalek = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
futures = "0.3"
# rand + rand_core feature: in-test Ed25519 keypair generation (SigningKey::generate)
# for genuine signature-verification tests. Test-only; not in the shipping lib path.
rand = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
