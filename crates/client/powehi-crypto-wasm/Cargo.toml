[package]
name = "powehi-crypto-wasm"
description = "WASM crypto core: MLS (openmls) + OPAQUE (opaque-ke) + Comlink worker interface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
thiserror = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# Post-quantum KEM (FIPS 203 ML-KEM-768)
ml-kem = { workspace = true }
# OPAQUE (RFC 9807) — pure Rust, compiles on native + wasm32. No homegrown crypto.
opaque-ke = { workspace = true, features = ["ristretto255", "argon2", "serde", "std"] }
# Argon2 KSF type used in the OPAQUE ciphersuite definition.
argon2 = { workspace = true }
# AES-256-GCM for client-side media encryption (prd.md §9.2, RustCrypto — approved
# per crypto-libraries-pinned.md). Pure-Rust; works on wasm32-unknown-unknown.
aes-gcm = { workspace = true }
# HKDF-SHA256 (RFC 5869) — derives the MLS Ed25519 signing key from a BIP-39
# seed for §8.5 Recovery Mechanism. Approved per crypto-libraries-pinned.md.
hkdf = { workspace = true }
# Ed25519 signing key (re-creates the SigningKey from HKDF output bytes for
# recovery-phrase derivation). Used at runtime by `recovery` module; was a
# dev-dep before §8.5. Approved per crypto-libraries-pinned.md.
ed25519-dalek = { workspace = true }
# BIP-39 mnemonic codes (24-word recovery phrase, PBKDF2-HMAC-SHA512 seed).
# Only consumed by powehi-crypto-wasm so kept as a direct (non-workspace) dep.
bip39 = "2"

# MLS (RFC 9420) on native: use the audited OpenMLS RustCrypto provider so the
# crate builds and tests on the host target (not just wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
# OS CSPRNG used by `recovery::generate_mnemonic` on the native host (cargo test).
# On wasm32 the same crate is depended on below with the `js` feature.
getrandom = { version = "0.2" }

# MLS on wasm32: openmls `js` feature wires WASM-safe time/rng shims.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
openmls = { workspace = true, features = ["js"] }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
# wasm32-unknown-unknown traps (rather than unwinds) on panic by default, which
# surfaces to JS as an opaque "unreachable executed" RuntimeError with no panic
# message or location. This crate's own docs (wasm_exports.rs, mls_group.rs)
# already document that a well-formed-but-corrupt state blob "can still panic
# deep inside openmls's storage read path" — without this hook that panic is
# undiagnosable from the browser console. Not a crypto primitive (diagnostics
# only); does not fall under crypto-libraries-pinned.md's crypto-library list.
console_error_panic_hook = "0.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Enable deterministic keygen/encap APIs for the FIPS 203 KAT test (test-only;
# not compiled into the production WASM binary). ADR-0003 Phase B, Y-5.
ml-kem = { workspace = true, features = ["deterministic"] }
# Note: ed25519-dalek was previously a dev-dep for the kem_credential KAT; it is
# now a runtime dep (above) for §8.5 recovery-phrase Ed25519 key derivation.

# proptest (and its rusty-fork → wait-timeout dependency) only compiles on native
# targets; exclude from wasm32 to avoid CI failures in `wasm-pack test --node`.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Property-based testing for crypto round-trips (testing-conventions.md).
# Not compiled into the WASM binary — dev-only.
proptest = { workspace = true }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
