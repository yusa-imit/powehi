[package]
name = "powehi-crypto-wasm"
description = "WASM crypto core: MLS (openmls) + OPAQUE (opaque-ke) + Comlink worker interface."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# js feature enables WASM-safe time/rng shims required by openmls on wasm32
openmls = { workspace = true, features = ["js"] }
opaque-ke = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
