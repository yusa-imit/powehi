[package]
name = "powehi-cli"
description = "Powehi terminal client (primary client, prd.md §7A): lib + thin `powehi` binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "powehi_cli"
path = "src/lib.rs"

[[bin]]
name = "powehi"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
aes-gcm = { workspace = true, features = ["zeroize"] }
libc = "0.2"
# Only to enable aes/zeroize via feature unification; do not remove.
aes = { version = "0.8", features = ["zeroize"] }
hkdf = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
