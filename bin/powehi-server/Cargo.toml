[package]
name = "powehi-server"
description = "Composition root — wires all adapters and starts the server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "powehi-server"
path = "src/main.rs"

[dependencies]
powehi-domain = { workspace = true }
powehi-port-inbound = { workspace = true }
powehi-port-outbound = { workspace = true }
powehi-application = { workspace = true }
powehi-config = { workspace = true }
powehi-telemetry = { workspace = true }
powehi-rest-api = { workspace = true }
powehi-ws-hub = { workspace = true }
powehi-postgres = { workspace = true }
powehi-redis = { workspace = true }
powehi-opaque = { workspace = true }
powehi-r2 = { workspace = true }
powehi-webpush = { workspace = true }
powehi-grpc = { workspace = true }
powehi-proto = { workspace = true }
axum = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
# TLS 1.3 minimum for gRPC inter-region listener (Y-TLS-VERSION closure)
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true }
