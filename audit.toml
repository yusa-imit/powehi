[advisories]
# RUSTSEC-2023-0071: rsa 0.9.10 — Marvin Attack timing side-channel
# Impact analysis: rsa is pulled into Cargo.lock transitively via sqlx-macros-core →
# sqlx-mysql, even though we only enable the "postgres" feature in sqlx.  The sqlx
# macros crate unconditionally lists all DB backends in its Cargo.toml dependencies.
# `cargo tree -i rsa` produces no output — rsa is NOT compiled into any Powehi binary.
# No fixed version is available upstream (cargo audit: "No fixed upgrade is available!").
# We acknowledge this advisory and will revisit when sqlx publishes a fix or removes
# the unconditional sqlx-mysql dependency from sqlx-macros-core.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
# Acceptable SPDX license expressions for direct and transitive dependencies.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
]

[bans]
# Deny duplicate versions of security-critical crates to keep the dependency graph tight.
multiple-versions = "warn"
deny = []
