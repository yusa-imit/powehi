[workspace]
resolver = "2"
members = [
    "crates/domain/powehi-domain",
    "crates/ports/powehi-port-inbound",
    "crates/ports/powehi-port-outbound",
    "crates/application/powehi-application",
    "crates/adapters/inbound/powehi-rest-api",
    "crates/adapters/inbound/powehi-ws-hub",
    "crates/adapters/inbound/powehi-grpc",
    "crates/adapters/outbound/powehi-postgres",
    "crates/adapters/outbound/powehi-redis",
    "crates/adapters/outbound/powehi-r2",
    "crates/adapters/outbound/powehi-opaque",
    "crates/adapters/outbound/powehi-mls",
    "crates/adapters/outbound/powehi-webpush",
    "crates/infra/powehi-config",
    "crates/infra/powehi-telemetry",
    "crates/infra/powehi-proto",
    "crates/client/powehi-crypto-wasm",
    "bin/powehi-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "AGPL-3.0-only"
repository = "https://github.com/yusa-imit/powehi"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# error handling
thiserror = "2"
anyhow = "1"
# async traits
async-trait = "0.1"
# bytes
bytes = "1"
# time
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# metrics / observability — zero-knowledge: labels carry only aggregate counts, no user PII
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
# web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
# database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
# redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# gRPC
tonic = "0.12"
prost = "0.13"
# X.509 parser (mTLS peer-cert region binding) — parser only, no homegrown crypto
x509-parser = { version = "0.16", default-features = false }
# crypto — no homegrown crypto; only audited libraries
openmls = { version = "0.8", default-features = false }
# OpenMLS native Rust crypto backend + basic credential helper (versions tracked by openmls 0.8.1)
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
opaque-ke = "3"
# argon2 KSF for OPAQUE (matches opaque-ke 3.0 argon2 feature dep range)
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
sha2 = "0.10"
hmac = "0.12"
# HKDF (RFC 5869) — approved per crypto-libraries-pinned.md. Used by §8.5
# recovery-phrase → MLS Ed25519 signing key derivation in powehi-crypto-wasm.
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
# Ed25519 signatures (approved per crypto-libraries-pinned.md; transitive via openmls_basic_credential).
# Pinned exact minor to match Cargo.lock resolution and prevent silent drift.
ed25519-dalek = "2.2"
# Post-quantum KEM (FIPS 203 ML-KEM-768) — approved per crypto-libraries-pinned.md.
# zeroize feature: derives Zeroize+ZeroizeOnDrop on DecapsulationKey, DecryptionKey,
# and their internals (s_hat secret polynomial) — required for key-material hygiene.
ml-kem = { version = "=0.2.3", features = ["zeroize"] }
# Web Push (RFC 8291 + RFC 8292 VAPID): ES256 signing via RustCrypto p256.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
# Outbound HTTP for push delivery — rustls only (no openssl, WASM-policy aligned).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Constant-time base64url for VAPID JWT encoding.
base64ct = { version = "1", features = ["alloc"] }
# config
config = "0.14"
# AWS SDK for Cloudflare R2 (S3-compatible) presigned URLs
# default-features = false drops the legacy `rustls` feature (→ rustls 0.21 → rustls-webpki 0.101.x;
# RUSTSEC-2026-0098/0099/0104). We explicitly re-add all needed defaults except `rustls`.
# `default-https-client` (→ aws-smithy-http-client/rustls-aws-lc → rustls 0.23) remains.
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
# integration testing
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
# workspace crates
powehi-domain = { path = "crates/domain/powehi-domain" }
powehi-port-inbound = { path = "crates/ports/powehi-port-inbound" }
powehi-port-outbound = { path = "crates/ports/powehi-port-outbound" }
powehi-application = { path = "crates/application/powehi-application" }
powehi-config = { path = "crates/infra/powehi-config" }
powehi-telemetry = { path = "crates/infra/powehi-telemetry" }
powehi-postgres = { path = "crates/adapters/outbound/powehi-postgres" }
powehi-redis = { path = "crates/adapters/outbound/powehi-redis" }
powehi-opaque = { path = "crates/adapters/outbound/powehi-opaque" }
powehi-r2 = { path = "crates/adapters/outbound/powehi-r2" }
powehi-rest-api = { path = "crates/adapters/inbound/powehi-rest-api" }
powehi-ws-hub = { path = "crates/adapters/inbound/powehi-ws-hub" }
powehi-proto = { path = "crates/infra/powehi-proto" }
powehi-grpc = { path = "crates/adapters/inbound/powehi-grpc" }
powehi-webpush = { path = "crates/adapters/outbound/powehi-webpush" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
