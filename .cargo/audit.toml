[advisories]
# RUSTSEC-2023-0071: rsa 0.9.10 — Marvin Attack timing side-channel
# Impact: rsa is pulled transitively via sqlx-macros-core → sqlx-mysql.
# We only enable the "postgres" feature; `cargo tree -i rsa` produces no output —
# rsa is NOT compiled into any Powehi binary.
# No upstream fix available. Revisit when sqlx removes the sqlx-mysql transitive dep.
#
# RUSTSEC-2026-0124: libcrux-chacha20poly1305 0.0.7 — Potential Panic on Overlong Ciphertext Buffer
# Impact: panic/DoS only — does NOT leak plaintext, keys, or ciphertext.
# Powehi non-negotiable (server never sees plaintext) is NOT violated.
# Reached only via a non-activated PQ feature path (hpke-rs's optional libcrux backend,
# hpke-rs-libcrux) in openmls_rust_crypto 0.5.1 — NOT openmls_rust_crypto's actual AEAD
# choice, which is RustCrypto's `chacha20poly1305` crate directly (verified in Cargo.lock's
# openmls_rust_crypto dependency list). `cargo tree -i libcrux-chacha20poly1305` (even with
# `--target all`) produces no output — like the rsa entry above, it's resolved into Cargo.lock
# but not compiled into any Powehi binary. Kept in sync with deny.toml's `[advisories]` comment,
# which already documented this correctly. Revisit when openmls_rust_crypto releases a new version.
#
# RUSTSEC-2025-0134: rustls-pemfile 2.2.0 — crate unmaintained
# Impact: maintenance warning only, no security vulnerability.
# Transitively pulled via tonic 0.12.3; no upgrade path until tonic 0.13+.
# Revisit when tonic bumps its rustls-pemfile dependency.
#
# RUSTSEC-2026-0173: proc-macro-error2 2.0.1 — crate unmaintained
# Impact: proc-macro-error2 is a COMPILE-TIME proc-macro crate (hax-lib-macros → hax-lib →
# libcrux → openmls_rust_crypto). It runs on the host machine during build to generate code
# and is NOT included in any production binary (not in WASM binary, not in server binary).
# `cargo tree -i proc-macro-error2` shows zero entries for default targets.
# Maintenance advisory only; no CVE or vulnerability disclosed.
# Cannot upgrade: openmls_rust_crypto 0.5.1 is the latest release; upstream must release a
# new version with updated libcrux to resolve. Revisit when openmls_rust_crypto is updated.
#
# RUSTSEC-2024-0384: instant 0.1.13 — crate unmaintained
# Impact: maintenance warning only, no CVE or vulnerability disclosed. Unlike proc-macro-error2
# above, `instant` IS present in the runtime graph (openmls 0.8.1 → fluvio-wasm-timer →
# parking_lot 0.11 → instant), including the WASM crypto worker build — it does ship, but only
# provides a monotonic-clock shim; it holds no key material and is not on any plaintext/crypto
# data path, so the "server never sees plaintext" invariant is unaffected.
# No safe upgrade available (author recommends `web-time`, which openmls/fluvio-wasm-timer do
# not use). Revisit when openmls bumps its fluvio-wasm-timer/parking_lot dependency.
#
# RUSTSEC-2026-0209 / RUSTSEC-2026-0210 / RUSTSEC-2026-0211: libcrux-aesgcm 0.0.7 — AAD length
# not enforced / unmaintained (renamed to libcrux-aes) / non-constant-time tag check.
# Impact: NOT compiled into any Powehi artifact. Same root cause as RUSTSEC-2026-0124 above:
# libcrux-aesgcm is reachable only through hpke-rs's optional "libcrux" feature (`hpke-rs-libcrux`),
# and openmls_rust_crypto 0.5.1 declares its `hpke-rs` dependency with `default-features = false,
# features = ["hazmat", "serialization"]` — "libcrux" is not in that list.
# `cargo tree -i libcrux-aesgcm --target all` (and `-i hpke-rs-libcrux --target all`) print
# "nothing to print" — confirmed via crypto-reviewer, cycle 305 — i.e. present in Cargo.lock's
# full potential graph but never actually linked into the server binary or the powehi-crypto-wasm
# artifact. No fixed upgrade exists upstream regardless (0209/0211 solutions both say "No fixed
# upgrade is available!"). Revisit if a `cargo update` ever activates hpke-rs's "libcrux" feature
# (re-run `cargo tree -i hpke-rs-libcrux --target all` — it must keep printing nothing).
#
# RUSTSEC-2026-0207 / RUSTSEC-2026-0208: libcrux-sha3 0.0.8 — incorrect output of incremental
# SHAKE on multiple squeeze calls / potential panic in AVX2 SHAKE-256.
# RUSTSEC-2026-0212: libcrux-secrets 0.0.5 — potentially incorrect constant-time swap/select on
# Aarch64 (side-channel class, not availability — noted honestly here, do not reuse the "DoS
# only" framing from the aesgcm/0124 entries above for this one).
# Impact: unlike the aesgcm chain, `libcrux-sha3` IS compiled in — it's hpke-rs 0.6.1's mandatory,
# non-optional dependency (`[dependencies.libcrux-sha3] version = "0.0.8"`, no `optional = true`),
# confirmed via `cargo tree -i libcrux-sha3` resolving straight to
# `hpke-rs → openmls_rust_crypto → powehi-crypto-wasm` with no --target flag needed.
# libcrux-secrets is reachable in the compiled graph only via libcrux-traits → libcrux-sha3 (its
# sole entry point — `cargo tree -i libcrux-secrets --target all` shows one chain), so it inherits
# the same reachability argument below rather than needing an independent trace.
# BUT: `hpke-rs-0.6.1/src/kem.rs` calls `libcrux_sha3::shake256` from exactly two call sites
# (lines 154, 158), both inside `derive_key_pair()`'s `KemAlgorithm::XWingDraft06* | MlKem768 |
# MlKem1024` match arms (X-Wing / ML-KEM post-quantum KEMs). The classical-DH arm
# (`DhKemP256|K256|P384|P521|DhKem25519|DhKem448`) calls `dh_kem::derive_key_pair` instead and
# never touches libcrux_sha3. Powehi's only currently-supported MLS ciphersuite is
# `MLS_128_DHKEMX25519_AES128GCM_SHA256_Ed25519` (classical X25519 DH); PQ hybrid
# (`MLS_128_MLKEM768`) is unimplemented, still blocked upstream (see project-context.md). More
# than that: `openmls_rust_crypto-0.5.1/src/provider.rs`'s `kem_mode()` maps
# `HpkeKemType::XWingKemDraft6 => unimplemented!()` and has no ML-KEM arm at all — this provider
# cannot construct the `KemAlgorithm` values that reach kem.rs:154/158 even if a PQ ciphersuite
# were selected, so the vulnerable branches are structurally unreachable via openmls_rust_crypto,
# not just "unused today." (Bonus, not load-bearing: both call sites use the one-shot
# `shake256::<N>()` API, not the incremental absorb/squeeze API RUSTSEC-2026-0207 describes, and
# powehi-crypto-wasm compiles to wasm32-unknown-unknown where AVX2 (0208) and Aarch64 (0212) code
# paths aren't even built — though native `cargo test`/`cargo nextest` runs on aarch64 dev
# machines do compile the 0212 arch path, so rely on the reachability argument, not the arch one.)
# Verified via crypto-reviewer, cycle 305. Re-verify on any `cargo update` touching hpke-rs,
# openmls_rust_crypto, or any libcrux-* crate: re-run `grep -n libcrux_sha3 kem.rs` on the new
# hpke-rs version and re-check `kem_mode()` on the new openmls_rust_crypto for an added ML-KEM arm.
# If Powehi ever ships a PQ hybrid ciphersuite through this same openmls_rust_crypto/hpke-rs path,
# these three waivers (and the aesgcm ones above, if "libcrux" activates) must be re-opened first —
# flagged to crypto-lead for the PQ-enablement cycle.
#
# RUSTSEC-2026-0253: lru 0.16.4 — potential use-after-free in LruCache::pop() if a stored key's
# Drop impl panics during pop() (requires unwinding panics + catch_unwind + a panicking key Drop).
# Impact: `lru v0.16.4 -> aws-sdk-s3 -> powehi-r2 -> powehi-server` (`cargo tree -i lru` confirms
# it IS compiled in, unlike the rsa/libcrux-chacha20poly1305 entries above). aws-sdk-s3 1.133.0's
# only `LruCache` use is `s3_express.rs`'s `Mutex<LruCache<CacheKey, ExpiringCache<..>>>`, the S3
# Express One Zone session-credentials cache, keyed by a plain `CacheKey(String)` newtype with no
# custom Drop impl. The SDK never calls `LruCache::pop()` on it — only `get_or_insert_mut` — so the
# advisory's panic-during-pop precondition can't even be reached through that call path, regardless
# of key type. Additionally Powehi's R2 client (`crates/adapters/outbound/powehi-r2/src/lib.rs`)
# uses `force_path_style` against Cloudflare R2 and never touches S3 Express One Zone buckets, so
# this cache path is doubly unreachable. Fixed upstream in lru 0.18.2, but aws-sdk-s3 1.133.0
# through 1.143.0 (latest checked — cycle 333) all still pin `lru = "^0.16.3"` non-optionally, so
# no upgrade path exists without waiting for AWS to bump their lru dependency; a `[patch.crates-io]`
# fork isn't warranted for an unreachable call path. Verified via security-auditor, cycle 333.
# Revisit when aws-sdk-s3 releases a version depending on lru >=0.18.2, or if Powehi ever adds S3
# Express One Zone bucket support (re-run `grep -n LruCache::pop\|get_or_insert_mut` on the new
# aws-sdk-s3's s3_express.rs to re-confirm pop() is still unused).
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0124",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2026-0207",
    "RUSTSEC-2026-0208",
    "RUSTSEC-2026-0209",
    "RUSTSEC-2026-0210",
    "RUSTSEC-2026-0211",
    "RUSTSEC-2026-0212",
    "RUSTSEC-2026-0253",
]
