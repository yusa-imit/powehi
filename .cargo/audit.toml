[advisories]
# RUSTSEC-2023-0071: rsa 0.9.10 — Marvin Attack timing side-channel
# Impact: rsa is pulled transitively via sqlx-macros-core → sqlx-mysql.
# We only enable the "postgres" feature; `cargo tree -i rsa` produces no output —
# rsa is NOT compiled into any Powehi binary.
# No upstream fix available. Revisit when sqlx removes the sqlx-mysql transitive dep.
#
# RUSTSEC-2026-0124: libcrux-chacha20poly1305 0.0.7 — Potential Panic on Overlong Ciphertext Buffer
# Impact: panic/DoS only — does NOT leak plaintext, keys, or ciphertext.
# Powehi non-negotiable (server never sees plaintext) is NOT violated.
# Transitively pulled via openmls_rust_crypto 0.5.1 → libcrux-aead 0.0.7.
# openmls_rust_crypto 0.5.1 is the latest; cannot upgrade to libcrux >=0.0.8 within
# the current dep graph.  Revisit when openmls_rust_crypto releases a new version.
#
# RUSTSEC-2025-0134: rustls-pemfile 2.2.0 — crate unmaintained
# Impact: maintenance warning only, no security vulnerability.
# Transitively pulled via tonic 0.12.3; no upgrade path until tonic 0.13+.
# Revisit when tonic bumps its rustls-pemfile dependency.
#
# RUSTSEC-2025-0111: tokio-tar 0.3.1 — PAX extended header parsing allows file smuggling
# Impact: tokio-tar is used internally by testcontainers (dev/test-only dep) to create tar
# archives that are sent TO the Docker daemon during container startup. It is never used to
# untar untrusted archives received from external sources.
# The file smuggling attack requires an adversary to supply a crafted tar archive; Powehi
# never processes untrusted tar data in any code path. No production binary includes this dep.
# No fixed version available upstream. Revisit when testcontainers upgrades tokio-tar.
#
# RUSTSEC-2026-0173: proc-macro-error2 2.0.1 — crate unmaintained
# Impact: proc-macro-error2 is a COMPILE-TIME proc-macro crate (hax-lib-macros → hax-lib →
# libcrux → openmls_rust_crypto). It runs on the host machine during build to generate code
# and is NOT included in any production binary (not in WASM binary, not in server binary).
# `cargo tree -i proc-macro-error2` shows zero entries for default targets.
# Maintenance advisory only; no CVE or vulnerability disclosed.
# Cannot upgrade: openmls_rust_crypto 0.5.1 is the latest release; upstream must release a
# new version with updated libcrux to resolve. Revisit when openmls_rust_crypto is updated.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0124", "RUSTSEC-2025-0134", "RUSTSEC-2025-0111", "RUSTSEC-2026-0173"]
