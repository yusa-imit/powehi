<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Powehi · Mobile</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    html, body, #root { margin: 0; min-height: 100%; background: #040408; }
    body { overflow-x: hidden; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-thumb { background: rgba(242,237,227,0.08); border-radius: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../web/Icon.jsx"></script>
  <script type="text/babel" src="../web/Atoms.jsx"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="Screens.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
  <script type="text/babel">
    function ScreenCard({ label, children }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
          {children}
          <div style={{
            fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase',
            color: '#898998', fontWeight: 500,
          }}>{label}</div>
        </div>
      );
    }
    window.ScreenCard = ScreenCard;
    ReactDOM.createRoot(document.getElementById('root')).render(<MobileDemo/>);
  </script>
</body>
</html>
