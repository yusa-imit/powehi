<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);font-family:var(--font-sans);color:var(--fg-1);overflow:hidden}
  .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:200px}
  .s{display:flex;flex-direction:column;justify-content:flex-end;padding:14px;gap:4px}
  .n{font-size:11px;text-transform:uppercase;letter-spacing:0.14em;font-weight:500}
  .h{font-family:var(--font-mono);font-size:11px;opacity:0.7}
</style></head><body>
<div class="wrap">
  <div class="s" style="background:#040408;color:#F2EDE3"><div class="n">Void</div><div class="h">#040408</div></div>
  <div class="s" style="background:#0C0C14;color:#F2EDE3"><div class="n">Surface</div><div class="h">#0C0C14</div></div>
  <div class="s" style="background:#16161F;color:#F2EDE3"><div class="n">Elevated</div><div class="h">#16161F</div></div>
  <div class="s" style="background:#20202D;color:#F2EDE3"><div class="n">Overlay</div><div class="h">#20202D</div></div>
  <div class="s" style="background:#08080F;color:#898998"><div class="n">Input well</div><div class="h">#08080F</div></div>
</div>
</body></html>
