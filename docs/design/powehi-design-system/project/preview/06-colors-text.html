<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;align-items:center;gap:18px;padding:6px 0}
  .swatch{width:88px;height:36px;border-radius:8px;flex:none}
  .name{min-width:140px;font-weight:500;font-size:14px}
  .desc{font-size:12px;color:var(--fg-3);flex:1}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
</style></head><body>
<div class="row"><div class="swatch" style="background:#F2EDE3"></div><div class="name">fg-1</div><div class="desc">Primary text, headlines, message body</div><div class="hex">#F2EDE3</div></div>
<div class="row"><div class="swatch" style="background:#BDBDC9"></div><div class="name">fg-2</div><div class="desc">Secondary text, metadata, sender names</div><div class="hex">#BDBDC9</div></div>
<div class="row"><div class="swatch" style="background:#898998"></div><div class="name">fg-3</div><div class="desc">Tertiary, captions, timestamps, placeholders</div><div class="hex">#898998</div></div>
<div class="row"><div class="swatch" style="background:#54546A"></div><div class="name">fg-4</div><div class="desc">Disabled, faint dividers, inactive labels</div><div class="hex">#54546A</div></div>
</body></html>
