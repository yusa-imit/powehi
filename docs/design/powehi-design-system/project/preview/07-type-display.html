<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:28px;font-family:var(--font-sans)}
  .row{display:flex;align-items:baseline;gap:24px;padding:8px 0;border-bottom:1px solid var(--border-faint)}
  .row:last-child{border-bottom:none}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);min-width:170px}
</style></head><body>
<div class="row"><div class="meta">Display · Serif 96 · italic</div>
  <div style="font-family:var(--font-serif);font-style:italic;font-size:56px;line-height:1;letter-spacing:-0.02em">Past the horizon.</div>
</div>
<div class="row"><div class="meta">H1 · Sans 44 / 600</div>
  <div style="font-weight:600;font-size:32px;letter-spacing:-0.02em">Encrypted messaging.</div>
</div>
<div class="row"><div class="meta">H2 · Sans 32 / 600</div>
  <div style="font-weight:600;font-size:24px;letter-spacing:-0.01em">Only the endpoints can read it.</div>
</div>
<div class="row"><div class="meta">Body · Sans 15 / 400</div>
  <div style="font-size:15px;color:var(--fg-1)">Messages cross encrypted on the way out. They're decrypted only on the device of the person you're talking to.</div>
</div>
</body></html>
