<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:24px;font-family:var(--font-sans)}
  .row{display:flex;gap:20px;align-items:center}
  .box{background:var(--bg-elevated);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;width:72px;height:72px;flex:none;color:var(--accretion-400)}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);text-align:center;margin-top:6px}
  .col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="border-radius:4px">●</div><div class="name">xs · 4</div></div>
  <div class="col"><div class="box" style="border-radius:8px">●</div><div class="name">sm · 8</div></div>
  <div class="col"><div class="box" style="border-radius:12px">●</div><div class="name">md · 12</div></div>
  <div class="col"><div class="box" style="border-radius:16px">●</div><div class="name">lg · 16</div></div>
  <div class="col"><div class="box" style="border-radius:24px">●</div><div class="name">xl · 24</div></div>
  <div class="col"><div class="box" style="border-radius:32px">●</div><div class="name">2xl · 32</div></div>
  <div class="col"><div class="box" style="border-radius:9999px">●</div><div class="name">pill</div></div>
</div>
</body></html>
