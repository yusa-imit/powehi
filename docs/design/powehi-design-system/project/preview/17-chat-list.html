<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:0;font-family:var(--font-sans)}
  .list{padding:8px}
  .item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;cursor:pointer}
  .item.active{background:var(--bg-elevated)}
  .item:hover{background:var(--bg-surface)}
  .a{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;color:#06060C;position:relative;font-size:16px}
  .a.p1{background:linear-gradient(135deg,#A8C8FF,#445C99)}
  .a.p2{background:linear-gradient(135deg,#FF8A3D,#6E2700);color:#fff}
  .a.p3{background:linear-gradient(135deg,#5EE6A8,#1F6B4C)}
  .dot{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:#5EE6A8;border:2.5px solid var(--bg-void);box-shadow:0 0 6px rgba(94,230,168,0.5)}
  .dot.off{background:var(--fg-4);box-shadow:none}
  .body{flex:1;min-width:0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .name{font-size:14px;font-weight:500;color:var(--fg-1)}
  .time{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;font-family:var(--font-mono)}
  .preview{font-size:13px;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
  .item.active .preview{color:var(--fg-2)}
  .unread{background:#FF8A3D;color:#2A0A00;font-weight:600;font-size:10px;border-radius:9999px;padding:2px 7px;font-variant-numeric:tabular-nums;margin-left:8px}
</style></head><body>
<div class="list">
  <div class="item active">
    <div class="a p1">M<div class="dot"></div></div>
    <div class="body">
      <div class="top"><div class="name">Maya Akana</div><div class="time">14:32</div></div>
      <div class="preview">Bringing the notebook.</div>
    </div>
  </div>
  <div class="item">
    <div class="a p2">J</div>
    <div class="body">
      <div class="top"><div class="name">Jordan</div><div class="time">12:08</div></div>
      <div class="preview">📎 receipt.pdf</div>
    </div>
    <span class="unread">2</span>
  </div>
  <div class="item">
    <div class="a p3">A<div class="dot off"></div></div>
    <div class="body">
      <div class="top"><div class="name">Ari · work</div><div class="time">Yesterday</div></div>
      <div class="preview">You: see you tmrw</div>
    </div>
  </div>
</div>
</body></html>
