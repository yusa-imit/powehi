<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:24px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(10,1fr);align-items:end;gap:8px;height:130px}
  .b{background:linear-gradient(180deg, var(--accretion-400), var(--accretion-600));border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;color:#1A0F08;font-family:var(--font-mono);font-size:10px;font-weight:600}
  .lbl{margin-top:6px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--fg-3)}
  .col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="grid">
  <div class="col"><div class="b" style="height:6px"></div><div class="lbl">1<br>4</div></div>
  <div class="col"><div class="b" style="height:12px"></div><div class="lbl">2<br>8</div></div>
  <div class="col"><div class="b" style="height:18px"></div><div class="lbl">3<br>12</div></div>
  <div class="col"><div class="b" style="height:24px"></div><div class="lbl">4<br>16</div></div>
  <div class="col"><div class="b" style="height:30px"></div><div class="lbl">5<br>20</div></div>
  <div class="col"><div class="b" style="height:36px"></div><div class="lbl">6<br>24</div></div>
  <div class="col"><div class="b" style="height:48px"></div><div class="lbl">7<br>32</div></div>
  <div class="col"><div class="b" style="height:60px"></div><div class="lbl">8<br>40</div></div>
  <div class="col"><div class="b" style="height:72px"></div><div class="lbl">9<br>48</div></div>
  <div class="col"><div class="b" style="height:96px"></div><div class="lbl">10<br>64</div></div>
</div>
</body></html>
