<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:24px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .label{font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--fg-3);font-weight:500}
  .input{background:var(--bg-input);border:1px solid var(--border-soft);color:var(--fg-1);font-family:var(--font-sans);font-size:14px;padding:11px 14px;border-radius:10px;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,0.55)}
  .input.focus{border-color:rgba(255,138,61,0.5);box-shadow:0 0 0 3px rgba(255,138,61,0.15), inset 0 1px 2px rgba(0,0,0,0.55)}
  .input.error{border-color:rgba(255,122,122,0.5)}
  .hint{font-size:11px;color:var(--fg-3)}
  .hint.err{color:#FF9999}
  .composer{display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:14px;padding:6px 6px 6px 14px}
  .composer input{background:transparent;border:none;outline:none;color:var(--fg-1);font-size:14px;flex:1;font-family:var(--font-sans)}
  .send{width:34px;height:34px;border-radius:50%;border:none;background:linear-gradient(180deg,#FF9E52,#FF7A2B);color:#2A0A00;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 1px rgba(255,138,61,0.35), 0 0 12px rgba(255,138,61,0.3);font-size:16px}
</style></head><body>
<div class="grid">
  <div class="field">
    <div class="label">Phone</div>
    <input class="input" value="+1 (555) 0124">
    <div class="hint">We'll text a 6-digit code.</div>
  </div>
  <div class="field">
    <div class="label">Username · focused</div>
    <input class="input focus" value="@maya">
    <div class="hint">Lowercase letters, digits, underscores.</div>
  </div>
  <div class="field">
    <div class="label">Recovery code · error</div>
    <input class="input error" value="A39-XX-FAIL">
    <div class="hint err">Code doesn't match. Try again.</div>
  </div>
  <div class="field">
    <div class="label">Composer</div>
    <div class="composer">
      <input placeholder="Message Maya — encrypted">
      <button class="send">↑</button>
    </div>
  </div>
</div>
</body></html>
