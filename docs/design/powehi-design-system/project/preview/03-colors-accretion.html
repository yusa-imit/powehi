<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);font-family:var(--font-sans);color:var(--fg-1);overflow:hidden}
  .wrap{padding:18px 22px;display:flex;gap:24px;align-items:center;height:100%;box-sizing:border-box}
  .disk{
    width:160px;height:160px;flex:none;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,
      #050308 0%, #050308 32%, #2A0A00 38%, #6E2700 44%,
      #B14507 50%, #E5681F 56%, #FF8A3D 62%,
      #FFB155 70%, #FFD78A 78%, #FFEFCC 82%,
      #FFB155 88%, #6E2700 94%, transparent 100%);
    position:relative;box-shadow:0 0 80px rgba(255,138,61,0.18);
  }
  .disk::before{content:"";position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(180deg, rgba(255,233,194,0.22), transparent 45%, rgba(0,0,0,0.22))}
  .dot{position:absolute;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.85);box-shadow:0 0 0 1px rgba(0,0,0,0.5)}
  .scale{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:0.16em;color:var(--fg-3);font-weight:500}
  .src{font-family:var(--font-mono);font-size:10px;color:var(--fg-4)}
  .row{display:flex;align-items:center;gap:10px}
  .chip{width:28px;height:18px;border-radius:4px;flex:none}
  .num{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);width:26px}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg-2);min-width:70px}
  .note{font-size:11px;color:var(--fg-3);flex:1}
  .tag{display:inline-block;font-size:9px;font-weight:600;letter-spacing:0.08em;
    background:#FF8A3D;color:#2A0A00;padding:1px 5px;border-radius:3px;margin-left:6px}
</style></head><body>
<div class="wrap">
  <div class="disk">
    <div class="dot" style="top:46%;left:46%;background:#2A0A00"></div>
    <div class="dot" style="top:28%;left:32%;background:#B14507"></div>
    <div class="dot" style="top:16%;left:50%;background:#FFD78A"></div>
    <div class="dot" style="top:11%;left:66%;background:#FFEFCC"></div>
    <div class="dot" style="top:50%;left:84%;background:#FF8A3D"></div>
  </div>
  <div class="scale">
    <div class="header">
      <div class="eyebrow">Accretion · warm</div>
      <div class="src">sampled · EHT Pōwehi</div>
    </div>
    <div class="row"><div class="num">50</div><div class="chip" style="background:#FFEFCC"></div><div class="hex">#FFEFCC</div><div class="note">hotspot peak</div></div>
    <div class="row"><div class="num">100</div><div class="chip" style="background:#FFD78A"></div><div class="hex">#FFD78A</div><div class="note">bright disk</div></div>
    <div class="row"><div class="num">200</div><div class="chip" style="background:#FFB155"></div><div class="hex">#FFB155</div><div class="note">warm rim</div></div>
    <div class="row"><div class="num">400</div><div class="chip" style="background:#FF8A3D;outline:1px solid rgba(255,255,255,0.3);outline-offset:1px"></div><div class="hex">#FF8A3D</div><div class="note">disk body<span class="tag">PRIMARY</span></div></div>
    <div class="row"><div class="num">500</div><div class="chip" style="background:#E5681F"></div><div class="hex">#E5681F</div><div class="note">hot inner edge</div></div>
    <div class="row"><div class="num">600</div><div class="chip" style="background:#B14507"></div><div class="hex">#B14507</div><div class="note">ember</div></div>
    <div class="row"><div class="num">700</div><div class="chip" style="background:#6E2700"></div><div class="hex">#6E2700</div><div class="note">deep ember</div></div>
    <div class="row"><div class="num">800</div><div class="chip" style="background:#2A0A00"></div><div class="hex">#2A0A00</div><div class="note">horizon shadow</div></div>
  </div>
</div>
</body></html>
