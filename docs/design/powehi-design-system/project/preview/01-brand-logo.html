<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);font-family:var(--font-sans);overflow:hidden}
  .wrap{
    height:100%;box-sizing:border-box;
    padding:28px 36px;display:flex;align-items:center;gap:32px;
  }
  .hero{width:104px;height:104px;flex:none}
  .hero img{display:block;width:100%;height:100%}
  .right{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .wordmark{
    font-weight:600;font-size:54px;line-height:1;
    letter-spacing:-0.04em;color:var(--fg-1);
    display:flex;align-items:center;
  }
  .wordmark .o{
    display:inline-block;width:0.62em;height:0.62em;
    border:4px solid var(--accretion-400);border-radius:50%;
    box-sizing:border-box;flex:none;
  }
  .tagline{
    font-family:var(--font-serif);font-style:italic;
    font-size:22px;line-height:1.2;color:var(--fg-2);
    letter-spacing:-0.01em;
  }
  .tagline em{color:var(--accretion-100);font-style:italic}
  .meta{
    display:flex;align-items:center;gap:12px;margin-top:4px;
    font-size:10px;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--fg-3);font-weight:500;
  }
  .meta .sep{width:18px;height:1px;background:var(--fg-4);opacity:0.6}
  .meta .lang{font-family:var(--font-mono);text-transform:none;letter-spacing:0;color:var(--fg-2);font-weight:400}
</style></head><body>
<div class="wrap">
  <div class="hero"><img src="../assets/logo-mark.svg" alt="Powehi"></div>
  <div class="right">
    <div class="wordmark">p<span class="o" aria-hidden="true"></span>wehi</div>
    <div class="tagline">Past the horizon, <em>only you.</em></div>
    <div class="meta">
      <span class="lang">pō·we·hi</span>
      <span class="sep"></span>
      <span>encrypted messaging</span>
    </div>
  </div>
</div>
</body></html>
