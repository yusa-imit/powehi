<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:28px;font-family:var(--font-sans)}
  .row{display:flex;align-items:baseline;gap:24px;padding:9px 0;border-bottom:1px solid var(--border-faint)}
  .row:last-child{border-bottom:none}
  .meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);min-width:170px}
  .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--fg-3);font-weight:500}
</style></head><body>
<div class="row"><div class="meta">H4 · Sans 20 / 500</div>
  <div style="font-weight:500;font-size:20px">Chats with Maya</div></div>
<div class="row"><div class="meta">Body · 15 / 400</div>
  <div style="font-size:15px">Hey — leaving the office in ten.</div></div>
<div class="row"><div class="meta">Body-sm · 13 / 400</div>
  <div style="font-size:13px;color:var(--fg-2)">Read 2 minutes ago · Pinned</div></div>
<div class="row"><div class="meta">Caption · 11 / 400</div>
  <div style="font-size:11px;color:var(--fg-3)">Today, 14:32</div></div>
<div class="row"><div class="meta">Eyebrow · 11 / 500 / 0.16</div>
  <div class="eyebrow">Encrypted · end-to-end</div></div>
<div class="row"><div class="meta">Mono · Geist Mono 13</div>
  <div style="font-family:var(--font-mono);font-size:13px;color:var(--fg-2)">A3:5F:91:CC:7E:08 · key fingerprint</div></div>
</body></html>
