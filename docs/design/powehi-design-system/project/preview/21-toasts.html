<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:24px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .toast{background:var(--bg-elevated);border:1px solid var(--border-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 12px 32px rgba(0,0,0,0.65), 0 4px 8px rgba(0,0,0,0.55)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}
  .ttl{font-size:13px;font-weight:500;color:var(--fg-1)}
  .sub{font-size:12px;color:var(--fg-3);margin-top:2px;line-height:1.4}
  .ok .dot{background:#5EE6A8;box-shadow:0 0 8px rgba(94,230,168,0.5)}
  .warn .dot{background:#FFB347;box-shadow:0 0 8px rgba(255,179,71,0.5)}
  .err .dot{background:#FF7A7A;box-shadow:0 0 8px rgba(255,122,122,0.5)}
</style></head><body>
<div class="grid">
  <div class="toast ok"><div class="dot"></div><div><div class="ttl">Message delivered</div><div class="sub">Maya's device confirmed receipt.</div></div></div>
  <div class="toast warn"><div class="dot"></div><div><div class="ttl">Keys changed</div><div class="sub">Maya started using a new device. Re-verify.</div></div></div>
  <div class="toast err"><div class="dot"></div><div><div class="ttl">Couldn't send</div><div class="sub">Out of range. We'll retry when you're back.</div></div></div>
</div>
</body></html>
