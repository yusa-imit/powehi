<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);padding:22px;font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
  .ic{width:44px;height:44px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;color:var(--fg-1)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-top:6px;text-align:center}
  .col{display:flex;flex-direction:column;align-items:center}
  svg{stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ic.lock{color:#A8C8FF;background:rgba(168,200,255,0.08);border-color:rgba(168,200,255,0.25)}
</style></head><body>
<div class="grid">
  <div class="col"><div class="ic lock"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><div class="lbl">lock</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div><div class="lbl">send</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div><div class="lbl">search</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div><div class="lbl">new chat</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M22 16.92V20a2 2 0 0 1-2.18 2A19.86 19.86 0 0 1 2 4.18 2 2 0 0 1 4 2h3.09a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div><div class="lbl">call</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div><div class="lbl">video</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></div><div class="lbl">attach</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div><div class="lbl">image</div></div>

  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M19 11v1a7 7 0 0 1-14 0v-1M12 19v3"/></svg></div><div class="lbl">mic</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg></div><div class="lbl">smile</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="lbl">check</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><polyline points="18 7 9.5 16 7 13.5"/><polyline points="22 11 14.5 18.5"/></svg></div><div class="lbl">read</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg></div><div class="lbl">more</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9 1.65 1.65 0 0 0 4.27 7.18l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.13.74.2 1.13.2H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div><div class="lbl">settings</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div><div class="lbl">close</div></div>
  <div class="col"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div><div class="lbl">arrow</div></div>
</div>
</body></html>
