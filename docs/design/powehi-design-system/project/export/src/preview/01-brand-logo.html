<!doctype html><html><head><meta charset="utf-8">
<title>Powehi · Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-void);color:var(--fg-1);font-family:var(--font-sans)}
  body{width:1400px;height:460px;display:flex;align-items:center;justify-content:center}
  .wrap{
    width:1400px;height:460px;box-sizing:border-box;
    padding:56px 72px;display:flex;align-items:center;gap:64px;
  }
  .hero{width:208px;height:208px;flex:none}
  .hero img{display:block;width:100%;height:100%}
  .right{flex:1;display:flex;flex-direction:column;gap:20px;min-width:0}
  .wordmark{
    font-weight:600;font-size:108px;line-height:1;
    letter-spacing:-0.04em;color:var(--fg-1);
    display:flex;align-items:center;
  }
  .wordmark .o{
    display:inline-block;width:0.62em;height:0.62em;
    border:8px solid var(--accretion-400);border-radius:50%;
    box-sizing:border-box;flex:none;
  }
  .tagline{
    font-family:var(--font-serif);font-style:italic;
    font-size:44px;line-height:1.2;color:var(--fg-2);
    letter-spacing:-0.01em;
  }
  .tagline em{color:var(--accretion-100);font-style:italic}
  .meta{
    display:flex;align-items:center;gap:24px;margin-top:8px;
    font-size:20px;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--fg-3);font-weight:500;
  }
  .meta .sep{width:36px;height:1px;background:var(--fg-4);opacity:0.6}
  .meta .lang{font-family:var(--font-mono);text-transform:none;letter-spacing:0;color:var(--fg-2);font-weight:400}
</style>
</head><body>
<div class="wrap">
  <div class="hero"><img src="../assets/logo-mark.svg" alt="Powehi"></div>
  <div class="right">
    <div class="wordmark">p<span class="o" aria-hidden="true"></span>wehi</div>
    <div class="tagline">Past the horizon, <em>only you.</em></div>
    <div class="meta">
      <span class="lang">pō·we·hi</span>
      <span class="sep"></span>
      <span>encrypted messaging</span>
    </div>
  </div>
</div>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#040408"/>
  <defs>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB155"/>
      <stop offset="30%" stop-color="#FF8A3D"/>
      <stop offset="60%" stop-color="#C75612" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3A1A06" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="100" cy="100" rx="74" ry="50" fill="url(#h)"/>
  <circle cx="100" cy="100" r="26" fill="#000"/>
  <circle cx="100" cy="100" r="26" fill="none" stroke="#E8F0FF" stroke-width="1"/>
</svg>
</template>
</body></html>
